<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Verdello Street Fight 7</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Double+Ink:wght@100..900&display=swap" rel="stylesheet">

    <!-- Stili del gioco (fuori dall'HTML) -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="areaGioco">
        <!-- HUD -->
        <div id="hud">
            <!-- Vita e stamina del giocatore 1 -->
            <div class="hud-lato sinistra">
                <div class="barra-fondo"></div>
                <div id="player-health" class="barra-valore"></div>
                <div id="player-stamina" class="barra-valore"></div>
            </div>

            <!-- Timer -->
            <div id="timer">60</div>

            <!-- Vita e stamina del giocatore 2 -->
            <div class="hud-lato destra">
                <div class="barra-fondo"></div>
                <div id="enemy-health" class="barra-valore"></div>
                <div id="enemy-stamina" class="barra-valore"></div>
            </div>
        </div>

        <!-- Canvas -->
        <canvas></canvas>

        <!-- Testo di fine partita -->
        <div id="displayText"></div>

        <!-- Schermata di caricamento (visibile finché gli asset non sono pronti) -->
        <div id="loadingScreen" class="schermata">
            <img class="logo" src="assets/UVSF7-logo.png" alt="Ultra Verdello Street Fight 7">
            <div id="loadingTesto">Caricamento…</div>
        </div>

        <!-- Menu (principale e sottomenu: le voci sono create da js/Menu.js) -->
        <div id="menu" class="schermata">
            <img id="menuLogo" src="assets/UVSF7-logo.png" alt="Ultra Verdello Street Fight 7">
            <div id="menuTitolo">Ultra Verdello Street Fight 7</div>
            <div id="menuVoci"></div>
        </div>
    </div>

    <!-- Script: l'ordine conta (Utili -> Stato -> Menu -> Classi -> Personaggi -> index) -->
    <script src="js/Utili.js"></script>
    <script src="js/Stato.js"></script>
    <script src="js/Menu.js"></script>
    <script src="js/Classi.js"></script>
    <script src="js/Personaggi.js"></script>
    <script src="index.js"></script>
</body>
</html>
