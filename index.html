<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiocoTps - Fighting Game</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Double+Ink:wght@100..900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div style="position: relative; display: inline-block;">
        <!-- HUD Container -->
        <div style="position: absolute; display: flex; width: 100%; align-items: center; padding: 20px; z-index: 10;">
            <!-- Player Health & Stamina -->
            <div style="position: relative; width: 750px; display: flex; justify-content: flex-end; border-top: 4px solid black; border-left: 4px solid black; border-bottom: 4px solid black;">
                <div style="background-color: red; height: 20px; width: 100%;"></div>
                <div id="player-health" style="position: absolute; background: #595818; bottom: 0; right: 0; top: 0; width: 100%;"></div>
                <div id="player-stamina" style="position: absolute; background: #482D20; bottom: 0; right: 0; top: 14px; width: 100%;"></div>
            </div>

            <!-- Timer -->
            <div id="timer" style="background-color: black; height: 50px; width: 100px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 4px solid black; font-family: 'Bitcount Prop Double Ink', sans-serif; font-size: 35px; color: white;">60</div>

            <!-- Enemy Health & Stamina -->
            <div style="position: relative; width: 750px; border-top: 4px solid black; border-right: 4px solid black; border-bottom: 4px solid black;">
                <div style="background-color: red; height: 20px;"></div>
                <div id="enemy-health" style="position: absolute; background: blue; bottom: 0; left: 0; right: 0; top: 0;"></div>
                <div id="enemy-stamina" style="position: absolute; background: turquoise; bottom: 0; left: 0; right: 0; top: 14px;"></div>
            </div>
        </div>

        <!-- Game Over Display -->
        <div id="displayText" style="position: absolute; color: aliceblue; font-size: 50px; align-items: center; justify-content: center; top: 0; left: 0; right: 0; bottom: 0; display: none; background-color: rgba(0, 0, 0, 0.7); z-index: 20;"></div>

        <!-- Canvas -->
        <canvas></canvas>
    </div>

    <!-- Scripts -->
    <script src="js/Utili.js"></script>
    <script src="js/Classi.js"></script>
    <script src="index.js"></script>
</body>
</html>
